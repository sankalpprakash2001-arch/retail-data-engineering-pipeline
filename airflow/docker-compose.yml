services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_local_only}
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    build: .
    image: walmart-airflow:2.9.3
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_local_only}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-replace-this-local-secret}
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      DATABRICKS_JOB_ID: ${DATABRICKS_JOB_ID:-}
      DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH:-}
      DATABRICKS_CATALOG: ${DATABRICKS_CATALOG:-walmart}
      DATABRICKS_SCHEMA: ${DATABRICKS_SCHEMA:-dbt_schema}
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./config:/opt/airflow/config
      - ../dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
    user: "50000:0"
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Walmart --lastname Admin --role Admin --email admin@example.com || true)"
    restart: "no"

  airflow-webserver:
    build: .
    image: walmart-airflow:2.9.3
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-volumes
    ports:
      - "8082:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build: .
    image: walmart-airflow:2.9.3
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

volumes:
  airflow_metadata:
  airflow_logs:
